<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的学习笔记</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
</head>
<body>

<header class="topbar">
  <button id="menu-btn" class="icon-btn" aria-label="目录">☰</button>
  <h1 class="brand">📒 我的学习笔记</h1>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="全文搜索：标题、正文、标签、来源…" autocomplete="off">
    <span id="search-count" class="search-count"></span>
  </div>
  <button id="new-btn" class="btn">＋ 新建笔记</button>
  <button id="theme-btn" class="icon-btn" aria-label="切换主题">◐</button>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <div class="tagbar" id="tagbar"></div>
    <ul id="note-list" class="note-list"></ul>
    <p class="sidebar-foot"><span id="total-count"></span></p>
  </aside>

  <main id="main" class="main">
    <article id="article" class="article"></article>
  </main>
</div>

<!-- 新建笔记面板 -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h2>新建笔记</h2>
      <button id="modal-close" class="icon-btn">✕</button>
    </div>
    <div class="modal-body">
      <label>标题 <input id="f-title" type="text" placeholder="例：Python 第2章 值与变量"></label>
      <div class="row">
        <label>日期 <input id="f-date" type="date"></label>
        <label>文件名 <input id="f-slug" type="text" placeholder="python-ch2"></label>
      </div>
      <label>来源 <input id="f-source" type="text" placeholder="《Introduction to Python Programming》第2章"></label>
      <label>标签（逗号分隔） <input id="f-tags" type="text" placeholder="Python, 第2章, 变量"></label>
      <label>一句话摘要 <input id="f-summary" type="text" placeholder="留空则自动从正文提取"></label>
      <label>正文（Markdown） <textarea id="f-body" rows="14" placeholder="## 小标题&#10;&#10;正文内容…"></textarea></label>
      <div class="hint">
        写好后点「下载 .md」，把文件放进 <code>notes/</code> 文件夹，再运行 <code>发布.command</code> 即可上线。
      </div>
    </div>
    <div class="modal-foot">
      <button id="btn-preview" class="btn ghost">预览</button>
      <button id="btn-copy" class="btn ghost">复制全文</button>
      <button id="btn-download" class="btn">下载 .md</button>
    </div>
  </div>
</div>

<script src="assets/vendor/marked.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
